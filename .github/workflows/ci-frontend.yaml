name: CI - Frontend App

on:
  push:
    branches: [main]
    tags: ['v*.*.*', '*.*.*']
    paths:
      - 'vod-fe/**'
      - '.github/workflows/ci-frontend.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'vod-fe/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic Version tag (e.g. 1.0.9, 1.0.0)'
        required: false
        default: '1.0.0'
        type: string

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  AWS_ACCOUNT_ID: "393698973321"
  ECR_REPOSITORY: streamforge-frontend

jobs:
  build-and-push:
    name: Build & Push Frontend Container (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Semantic Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG_VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
          else
            # Extract from package.json if available, otherwise fallback to 1.0.0
            TAG_VER=$(node -p "try { require('./vod-fe/package.json').version } catch(e) { '1.0.0' }")
            if [ -z "$TAG_VER" ] || [ "$TAG_VER" = "0.0.0" ]; then
              TAG_VER="1.0.0"
            fi
          fi
          echo "Resolved version: $TAG_VER"
          echo "version=$TAG_VER" >> $GITHUB_OUTPUT

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vod-fe/package-lock.json

      - name: Install Dependencies
        working-directory: vod-fe
        run: npm ci || npm install

      - name: Build Application
        working-directory: vod-fe
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Configure AWS Credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: vod-fe
          file: vod-fe/Dockerfile
          push: true
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.version }}
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout vod-cfg repository for GitOps update
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/checkout@v4
        with:
          repository: icurff/vod-cfg
          token: ${{ secrets.GITOPS_PAT_TOKEN }}
          ref: main
          path: vod-cfg
        continue-on-error: true

      - name: Update image tag in vod-cfg
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        working-directory: vod-cfg
        continue-on-error: true
        run: |
          SERVICE="frontend"
          TAG="${{ steps.version.outputs.version }}"
          
          echo "Updating image tag for $SERVICE to $TAG on main (dev)..."
          
          # Install yq
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          
          # Update values.yaml and values-dev.yaml
          if [ -f helm/streamforge/values.yaml ]; then
            yq eval ".services.\"${SERVICE}\".image.tag = \"${TAG}\"" -i helm/streamforge/values.yaml
          fi
          
          if [ -f helm/streamforge/values-dev.yaml ]; then
            yq eval ".services.\"${SERVICE}\".image.tag = \"${TAG}\"" -i helm/streamforge/values-dev.yaml
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/streamforge/
          git commit -m "chore(cd): update $SERVICE image tag to $TAG [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Trigger GitOps Update via Repository Dispatch (Fallback)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITOPS_PAT_TOKEN }}
          repository: icurff/vod-cfg
          event-type: update-image
          client-payload: '{"service": "frontend", "tag": "${{ steps.version.outputs.version }}", "environment": "dev"}'
