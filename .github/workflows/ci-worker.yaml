name: CI - Transcode Worker

on:
  push:
    branches: [main]
    paths:
      - 'transcode-worker/**'
      - '.github/workflows/ci-worker.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'transcode-worker/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  AWS_ACCOUNT_ID: "393698973321"
  ECR_REPOSITORY: streamforge-worker

jobs:
  build-and-push:
    name: Build & Push Transcode Worker Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: transcode-worker/package-lock.json

      - name: Install Dependencies
        working-directory: transcode-worker
        run: npm ci || npm install

      - name: Build TypeScript
        working-directory: transcode-worker
        run: npm run build

      - name: Configure AWS Credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: transcode-worker
          file: transcode-worker/Dockerfile
          push: true
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout vod-cfg repository for GitOps update
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          repository: icurff/vod-cfg
          token: ${{ secrets.GITOPS_PAT_TOKEN }}
          ref: main
          path: vod-cfg
        continue-on-error: true

      - name: Update image tag in vod-cfg
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: vod-cfg
        continue-on-error: true
        run: |
          SERVICE="transcode-worker"
          TAG="${{ github.sha }}"
          
          echo "Updating image tag for $SERVICE to $TAG on main (dev)..."
          
          # Install yq
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          
          # Update values.yaml
          if [ -f helm/streamforge/values.yaml ]; then
            yq eval ".services.\"${SERVICE}\".image.tag = \"${TAG}\"" -i helm/streamforge/values.yaml
          fi
          
          if [ -f helm/streamforge/values-dev.yaml ]; then
            yq eval ".services.\"${SERVICE}\".image.tag = \"${TAG}\"" -i helm/streamforge/values-dev.yaml
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/streamforge/
          git commit -m "chore(cd): update $SERVICE image tag to $TAG [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Trigger GitOps Update via Repository Dispatch (Fallback)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITOPS_PAT_TOKEN }}
          repository: icurff/vod-cfg
          event-type: update-image
          client-payload: '{"service": "transcode-worker", "tag": "${{ github.sha }}", "environment": "dev"}'
