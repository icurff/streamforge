services:
  mongodb:
    image: mongo:6.0
    container_name: streamforge-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - streamforge-network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: streamforge-azurite
    restart: unless-stopped
    ports:
      - "10000:10000"
    networks:
      - streamforge-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamforge-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      AZURE_COSMOS_MONGODB_URI: "mongodb://mongodb:27017/voddb"
      MONGO_DATABASE: "voddb"
      AZURE_STORAGE_CONTAINER_NAME: "vod-container"
      ICURFF_APP_STORAGE: "/app/storage"
    depends_on:
      - mongodb
      - azurite
    networks:
      - streamforge-network

  worker:
    build:
      context: ../transcode-worker
      dockerfile: Dockerfile
    container_name: streamforge-worker
    restart: unless-stopped
    environment:
      AZURE_COSMOS_MONGODB_URI: "mongodb://mongodb:27017/voddb"
      MONGO_DATABASE: "voddb"
      AZURE_STORAGE_CONTAINER_NAME: "vod-container"
      AZURE_MEDIA_CDN_URL: "https://media.icurff.site"
    depends_on:
      - mongodb
      - azurite
    networks:
      - streamforge-network

volumes:
  mongo_data:

networks:
  streamforge-network:
    driver: bridge
